version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: mep-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - mep-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mep-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/MEP
      - JWT_SECRET=your_production_secret_key_change_me
      - JWT_EXPIRES=90d
      - NODE_ENV=production
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      - mongodb
    networks:
      - mep-network

  soket:
    build:
      context: ./soket
      dockerfile: Dockerfile
    container_name: mep-socket
    restart: always
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - CLIENT_URL=http://localhost:3000
    networks:
      - mep-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mep-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_BACKEND_URL=http://localhost:5000
      - REACT_APP_SOCKET_URL=http://localhost:4000
    depends_on:
      - backend
      - soket
    networks:
      - mep-network

volumes:
  mongo-data:

networks:
  mep-network:
    driver: bridge
